<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width>, initial-scale=1.0">
    <title>Javascript</title>
    <link rel="stylesheet" href="style.css">  
</head>
<body>
<div class="container">
 <h1>Boas Vindas</h1>
 <p>Vamos personalizar sua Saudação usando Javascript</p> 
 <div class="saudacao" id="mensagemSaudacao">Olá, Visitantes</div>
 <button OnClick="mudarNome()">Personalizar Saudação</button>
</div>


    <script>
        function mudarNome(){
                document.getElementById("mensagemSaudacao").textContent = "Olá Iago"

        } 
        
        

     
    </script>
</body>
</html>
